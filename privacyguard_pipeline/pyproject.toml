[project]
name = "privacyguard-pipeline"
version = "1.2.0"
description = "Production-ready PII anonymization pipeline for LLM API calls and PDF documents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Oleg Ponomarev" },
]

dependencies = [
    "natasha==1.6.0",
    "phonenumbers>=8.13",
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "setuptools<67.0", 
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
pdf = [
    "PyMuPDF>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
privacyguard = "privacyguard_pipeline.main:main"

[tool.setuptools.packages.find]
where = [".."]
include = [
    "privacyguard_pipeline",
    "privacyguard_pipeline.*",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "Q"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]